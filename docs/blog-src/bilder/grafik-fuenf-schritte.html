<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>In fünf Schritten zum Betrieb</title><link rel="stylesheet" href="stil.css"></head>
<body class="schmal"><div class="grafik" style="--acc:var(--green)">
<span class="mono">Einführung</span>
<h2>In fünf Schritten zum Betrieb</h2>
<div class="schritte" style="margin-top:0;gap:14px">
  <div class="schritt" style="padding:20px 24px"><span class="zahl" style="margin:0;width:44px">01</span><b class="t" style="font-size:23px">Eine Aufgabe wählen</b><span style="color:var(--muted);margin-left:auto;font-size:18px">häufig, prüfbar, ohne Risiko</span></div>
  <div class="schritt" style="padding:20px 24px"><span class="zahl" style="margin:0;width:44px">02</span><b class="t" style="font-size:23px">Grenzen festlegen</b><span style="color:var(--muted);margin-left:auto;font-size:18px">Stufen, Budget, Schritte</span></div>
  <div class="schritt" style="padding:20px 24px"><span class="zahl" style="margin:0;width:44px">03</span><b class="t" style="font-size:23px">Wissen geben</b><span style="color:var(--muted);margin-left:auto;font-size:18px">Regeln und gute Beispiele</span></div>
  <div class="schritt" style="padding:20px 24px"><span class="zahl" style="margin:0;width:44px">04</span><b class="t" style="font-size:23px">Zwei Wochen messen</b><span style="color:var(--muted);margin-left:auto;font-size:18px">Trefferquote, Zeit, Kosten</span></div>
  <div class="schritt" style="padding:20px 24px"><span class="zahl" style="margin:0;width:44px">05</span><b class="t" style="font-size:23px">Erweitern</b><span style="color:var(--muted);margin-left:auto;font-size:18px">mehr Spielraum, mehr Agenten</span></div>
</div>

</div></body></html>

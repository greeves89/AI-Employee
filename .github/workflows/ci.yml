name: CI

# Catches the class of failures that took the site down (import-time crashes reaching
# prod) BEFORE a merge/deploy. Agents and humans push to main autonomously, so this is
# the gate that keeps a broken commit from 502-ing production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Import smoke: would have caught BOTH 502s (router settings-shadow +
  #    empty KIOSK_ENABLED bool-parse). No DB needed — just imports the app. ──
  orchestrator-import:
    name: Orchestrator import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install orchestrator
        working-directory: orchestrator
        run: pip install --no-cache-dir -e .
      - name: Import app.main (reproduces empty-string env like compose passes)
        working-directory: orchestrator
        env:
          KIOSK_ENABLED: "" # the exact case that crashed the orchestrator on 2026-07-03
        run: python -c "import app.main; print('app.main imports OK')"

  # ── Unit tests ──
  orchestrator-tests:
    name: Orchestrator pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_employee
          POSTGRES_USER: ai_employee
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ai_employee" --health-interval=5s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install orchestrator (+ test deps)
        working-directory: orchestrator
        run: |
          pip install --no-cache-dir -e .
          pip install --no-cache-dir pytest pytest-asyncio aiosqlite ruff numpy
      # Undefinierte Namen sind zur Laufzeit ein NameError, aber beim Import
      # unsichtbar. Genau so lief das Anlegen eines Agenten fuenf Tage lang in
      # einen 500 ("cannot access local variable 'config'"), waehrend die Tests
      # gruen waren. Eigener Schritt und nicht nur im pytest-Lauf: so steht der
      # Grund im CI-Protokoll, statt in einer Testmeldung zu verschwinden.
      - name: Lint — undefinierte Namen (F821)
        run: ruff check --select F821 --output-format concise orchestrator/app agent/app
      - name: Run tests
        working-directory: orchestrator
        env:
          DATABASE_URL: postgresql+asyncpg://ai_employee:testpassword@localhost:5432/ai_employee
          REDIS_URL: redis://localhost:6379
          KIOSK_ENABLED: "false"
        run: pytest -q

  # ── Agenten-Testlauf. Frueher liefen hier DREI namentlich genannte Dateien,
  #    und der Rest der Suite gar nicht: jeder neue Agenten-Test war damit ab
  #    dem Tag seiner Entstehung tot. Jetzt die ganze Suite; die Dateien, die
  #    ein Netz oder fremde Module brauchen, schliessen sich selbst aus. ──
  agent-tests:
    name: Agent pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install agent (+ test deps)
        working-directory: agent
        run: |
          pip install --no-cache-dir -e .
          # trio: anyio faehrt jeden @pytest.mark.anyio-Test gegen BEIDE Backends.
          # Ohne trio faellt die Haelfte mit ModuleNotFoundError aus — nicht weil
          # der Code kaputt waere, sondern weil das Backend fehlt.
          pip install --no-cache-dir pytest pytest-asyncio trio
      - name: Run agent tests
        working-directory: agent
        run: pytest -q

  # ── Release-Spur (#699): VERSION, Dockerfile-Label und CHANGELOG gehoerten
  #    zusammen, wurden aber von nichts geprueft. Folge am 02.09.2026: zwei Paare
  #    offener PRs auf derselben Nummer, drei unter dem Stand von main, ein
  #    Direkt-Commit ganz ohne Eintrag. Auf main hart, im PR nur ein Hinweis —
  #    dort kann der Merge die Nummer noch aufloesen. ──
  release-track:
    name: Release-Spur
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Der Push-Check vergleicht gegen den vorherigen Stand; mit einem
          # flachen Klon gibt es keinen.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruefe die Spur (main)
        if: github.event_name == 'push'
        run: python scripts/release_track_check.py push --vorher "${{ github.event.before }}"
      - name: Hinweise zur Spur (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Die Nummern der ANDEREN offenen PRs holen — der einzige Teil, der
          # sich nicht aus dem Checkout allein beantworten laesst.
          fremde=""
          for nr in $(gh pr list --state open --json number -q '.[].number'); do
            [ "$nr" = "${{ github.event.number }}" ] && continue
            zweig=$(gh pr view "$nr" --json headRefName -q .headRefName)
            v=$(git show "origin/$zweig:VERSION" 2>/dev/null | tr -d '[:space:]') || true
            [ -n "$v" ] && fremde="$fremde,$nr=$v"
          done
          git fetch -q origin main
          python scripts/release_track_check.py pr --basis origin/main --fremde "${fremde#,}"

  # ── Kundennamen in GitHub-Inhalten (#688-Folgefund, 03.09.2026): Die
  #    Datei-Wache deckte nur den Quelltext ab. Issues, PR-Beschreibungen und
  #    Kommentare stehen auf derselben oeffentlichen Seite und wurden nie
  #    geprueft — es standen neun Issues, ein PR und zwei Kommentare offen da. ──
  github-customer-names:
    name: Kundennamen in Issues/PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruefe Issues, Pull Requests und Kommentare
        env:
          GH_TOKEN: ${{ github.token }}
        # Nur die letzten 30 Tage: der Altbestand ist bereinigt, und ein Lauf
        # ueber alles kostet bei jedem Push mehrere hundert API-Aufrufe.
        run: python scripts/check_github_customer_names.py --seit 30

  # ── Compose validity: would have caught a broken docker-compose.yml before deploy. ──
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose
        run: docker compose config -q && echo "compose OK"

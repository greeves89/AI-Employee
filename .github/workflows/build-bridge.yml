name: Build Computer-Use Bridge

on:
  push:
    branches:
      - main
      - feat/issue-70-computer-use
    paths:
      - "computer-use-bridge/**"
      - ".github/workflows/build-bridge.yml"
      - "VERSION"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # AUS requirements.txt, nicht aus einer zweiten Liste hier. Die
      # handgepflegte Liste war auseinandergelaufen: pynput (Replay),
      # sounddevice/numpy (Mikrofon) und Quartz (Bildschirmfoto im eigenen
      # Prozess) fehlten im Build. Weil bridge.py fehlende Importe abfaengt und
      # eine freundliche Meldung zurueckgibt, fiel das nie auf — die Faehigkeit
      # war im ausgelieferten Programm einfach still tot.
      # Die Plattform-Marker in requirements.txt sortieren selbst aus, was hier
      # gebraucht wird.
      - name: Install dependencies
        working-directory: computer-use-bridge
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set bridge artifact version
        id: bridge_version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=AI-Employee-Bridge-v$VERSION.dmg" >> "$GITHUB_OUTPUT"
          printf '"""Generated during the bridge release build."""\n\nBRIDGE_VERSION = "%s"\n' "$VERSION" > computer-use-bridge/_version.py

      - name: Build .app with PyInstaller
        working-directory: computer-use-bridge
        run: |
          pyinstaller bridge_macos.spec --noconfirm --clean

      - name: Check Apple signing secrets
        id: apple_signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_P12_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.apple_signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Codesign .app
        if: steps.apple_signing.outputs.available == 'true'
        working-directory: computer-use-bridge
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="dist/AI-Employee Bridge.app"

          # `codesign --deep` signiert von AUSSEN nach innen und laesst
          # verschachtelte Binaries (Python-Framework, dylibs, .so) ungueltig
          # bzw. ohne Hardened Runtime zurueck — genau das lehnt Apples
          # Notardienst als "signature of the binary is invalid" ab
          # (Submission 2026-08-18). Fuer die Notarisierung MUSS jede Mach-O
          # einzeln signiert werden, von INNEN nach aussen, jeweils mit
          # `--options runtime` und `--timestamp` (sicherer Zeitstempel).
          #
          # Reihenfolge: erst alle eingebetteten Binaries (tiefste zuerst),
          # dann das Bundle selbst mit den Entitlements.

          sign_one() {
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }

          # 1. Alle eingebetteten Mach-O-Dateien einsammeln: dylibs, .so und
          #    jede ausfuehrbare Datei mit Mach-O-Magic. `file` erkennt sie
          #    zuverlaessiger als eine Endungs-Heuristik (PyInstaller legt
          #    Binaries ohne Endung ab, z.B. Python).
          find "$APP/Contents" -type f \
            \( -name "*.dylib" -o -name "*.so" -o -perm -u+x \) \
          | while IFS= read -r f; do
              if file -b "$f" | grep -q "Mach-O"; then
                echo "  sign: $f"
                sign_one "$f"
              fi
            done

          # 2. Verschachtelte Frameworks (Python.framework) als Ganzes.
          find "$APP/Contents" -type d -name "*.framework" \
          | while IFS= read -r fw; do
              echo "  sign framework: $fw"
              sign_one "$fw"
            done

          # 3. Zum Schluss das Bundle selbst — MIT Entitlements, sie gelten
          #    fuer den Hauptprozess.
          codesign --force --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"

          # Streng pruefen wie Gatekeeper es tut.
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP" | head -30

      - name: Create .dmg
        working-directory: computer-use-bridge
        run: |
          set -euo pipefail
          # Create a temp folder with the .app
          mkdir -p dmg_stage
          # `cp -r` zerstoert die Code-Signatur: BSD-cp mangelt die
          # Symlink-Struktur von Python.framework (Versions/Current), womit die
          # gesiegelte Framework-Signatur ungueltig wird — Apples Notardienst
          # meldete daraufhin "signature of the binary is invalid", obwohl
          # `codesign --verify` VOR dem Kopieren noch bestand. `ditto` ist
          # Apples Werkzeug fuer genau das: es kopiert signierte Bundles samt
          # Symlinks und Signatur unveraendert.
          ditto "dist/AI-Employee Bridge.app" "dmg_stage/AI-Employee Bridge.app"

          # Beweis, dass die Signatur den Kopiervorgang UEBERLEBT hat — sonst
          # scheitert erst Apple Minuten spaeter, und niemand sieht warum.
          if [ "${{ steps.apple_signing.outputs.available }}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "dmg_stage/AI-Employee Bridge.app"
          fi

          # Create a symlink to /Applications for drag-install UX
          ln -s /Applications dmg_stage/Applications

          # Build the .dmg using hdiutil (built-in macOS tool)
          hdiutil create \
            -volname "AI-Employee Bridge" \
            -srcfolder dmg_stage \
            -ov \
            -format UDZO \
            "../${{ steps.bridge_version.outputs.dmg_name }}"

      - name: Codesign .dmg
        if: steps.apple_signing.outputs.available == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "${{ steps.bridge_version.outputs.dmg_name }}"
          codesign --verify --verbose=2 "${{ steps.bridge_version.outputs.dmg_name }}"

      - name: Notarize .dmg
        if: steps.apple_signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.bridge_version.outputs.dmg_name }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "${{ steps.bridge_version.outputs.dmg_name }}"

      - name: Create legacy DMG alias
        run: |
          cp -f "${{ steps.bridge_version.outputs.dmg_name }}" AI-Employee-Bridge.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: AI-Employee-Bridge-macOS
          path: |
            ${{ steps.bridge_version.outputs.dmg_name }}
            AI-Employee-Bridge.dmg
          retention-days: 30

      - name: Remove stale bridge release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset bridge-latest "${{ steps.bridge_version.outputs.dmg_name }}" --repo "$GITHUB_REPOSITORY" -y || true
          gh release delete-asset bridge-latest "AI-Employee-Bridge.dmg" --repo "$GITHUB_REPOSITORY" -y || true

      - name: Publish to bridge-latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: bridge-latest
          name: "Bridge — Latest Build"
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.bridge_version.outputs.dmg_name }}
            AI-Employee-Bridge.dmg

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Wie beim macOS-Build: requirements.txt ist die einzige Wahrheit. Hier
      # fehlte zusaetzlich `uiautomation` — ohne das kann die Bridge unter
      # Windows nur klicken, wohin jemand zeigt, aber KEINE Elemente finden.
      # Das ausgelieferte Programm war damit im Blindflug, genau das, was der
      # Kommentar an der Abhaengigkeit zu verhindern versucht.
      - name: Install dependencies
        working-directory: computer-use-bridge
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set bridge version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $lines = @(
            '"""Generated during the bridge release build."""',
            '',
            "BRIDGE_VERSION = `"$version`""
          )
          Set-Content -Path computer-use-bridge\_version.py -Value $lines -Encoding UTF8

      - name: Build .exe with PyInstaller
        working-directory: computer-use-bridge
        run: |
          pyinstaller bridge_windows.spec --noconfirm --clean

      - name: Zip the executable
        working-directory: computer-use-bridge
        run: |
          Compress-Archive -Path dist\AI-Employee-Bridge.exe `
            -DestinationPath ..\AI-Employee-Bridge-Windows.zip
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: AI-Employee-Bridge-Windows
          path: AI-Employee-Bridge-Windows.zip
          retention-days: 30

      - name: Remove stale bridge release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset bridge-latest "AI-Employee-Bridge-Windows.zip" --repo "$env:GITHUB_REPOSITORY" -y
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No stale Windows bridge asset to remove."
            $global:LASTEXITCODE = 0
          }
        shell: pwsh

      - name: Publish to bridge-latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: bridge-latest
          name: "Bridge — Latest Build"
          prerelease: true
          make_latest: false
          files: AI-Employee-Bridge-Windows.zip

# Verwaltete Codex-Richtlinie (/etc/codex/requirements.toml, root-eigen).
# Gleicher Hook wie fuer Claude Code (managed-settings.json daneben), siehe
# agent/mcp/pretooluse-hook.mjs. Nutzer-, Projekt- und Sitzungs-Hooks zaehlen
# nicht; features.hooks ist festgenagelt, damit "-c features.hooks=false" den
# Hook nicht abschaltet (live geprueft mit codex-cli 0.165).
allow_managed_hooks_only = true

[features]
hooks = true

[hooks]
managed_dir = "/opt/mcp"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/opt/mcp/pretooluse-hook.mjs"
timeout = 15

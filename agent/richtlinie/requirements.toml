# Verwaltete Codex-Richtlinie (/etc/codex/requirements.toml, root-eigen).
# Gleicher Hook wie fuer Claude Code (managed-settings.json daneben), siehe
# agent/mcp/pretooluse-hook.mjs. Nutzer-, Projekt- und Sitzungs-Hooks zaehlen
# nicht; features.hooks ist festgenagelt, damit "-c features.hooks=false" den
# Hook nicht abschaltet (live geprueft mit codex-cli 0.165). Node mit festem Pfad
# und LEERER Umgebung (nur der Lauf fuer die Push-Sperre): /opt/build-tools (dem
# Agenten gehoerig) steht im PATH vor /usr/bin, und NODE_OPTIONS & Co. erbt der
# Hook von der CLI — beides haette ihn sonst ersetzen koennen. Codex fuehrt das
# Kommando ueber die Shell aus, "$AI_EMPLOYEE_LAUF" wird aufgeloest (live geprueft).
allow_managed_hooks_only = true

[features]
hooks = true

[hooks]
managed_dir = "/opt/mcp"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/env -i AI_EMPLOYEE_LAUF=\"$AI_EMPLOYEE_LAUF\" /usr/bin/node /opt/mcp/pretooluse-hook.mjs"
timeout = 15
